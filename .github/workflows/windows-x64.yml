name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows x64 sidecar
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.0,<7"
          New-Item -ItemType Directory -Force src-tauri/binaries, .sidecar-build/dist, .sidecar-build/work | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile `
            --name opencodex-sidecar `
            --paths python `
            --distpath .sidecar-build/dist `
            --workpath .sidecar-build/work `
            --specpath .sidecar-build `
            python/sidecar_main.py
          Copy-Item .sidecar-build/dist/opencodex-sidecar.exe `
            src-tauri/binaries/opencodex-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build Windows installers
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
